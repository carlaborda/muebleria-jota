<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Mueblería Hermanos Jota — Catálogo de Productos</title>
    <link rel="stylesheet" href="itba.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a href="index.html" class="brand" aria-label="Ir a inicio">
          <span class="brand-mark" aria-hidden="true">
            <img src="img/logo.svg" alt="Hermanos Jota" />
          </span>
          <span class="brand-text">
            <strong>Hermanos</strong>
            Jota
          </span>
        </a>

        <nav aria-label="Menú principal" class="main-nav">
          <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="productos.html" aria-current="page">Productos</a></li>
            <li><a href="contacto.html">Contacto</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="page-main container">
      <h1>Mueblería Hermanos Jota</h1>

      <section id="catalogo" aria-labelledby="catalogo-title">
        <h2 id="catalogo-title">Catálogo de Productos</h2>
        <!-- Campo de búsqueda -->
          <div class="buscador-container">
            <label for="input-busqueda" class="visually-hidden">Buscar productos</label>
            <input 
              type="search" 
              id="input-busqueda" 
              placeholder="Buscar por nombre, material o estilo..."
              autocomplete="off"
            >
          </div>
        <div id="catalogo-productos" aria-live="polite"></div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <address>
          Av. San Juan 2847, CABA<br>
          Tel: (011) 1234-5678 — Email: contacto@hermanosjota.example
        </address>
        <p>&copy; <span>1996–2026</span> Mueblería Hermanos Jota. 30 años de tradición.</p>
      </div>
    </footer>

    <script src="catalogo.js"></script>
  </body>
</html>
